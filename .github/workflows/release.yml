# Builds a platform-specific .vsix (bundling a native runescript-lsp) per VS Code target.
# A v* tag also attaches them to a GitHub Release and publishes them to the Marketplace
# through Trusted Publishing (OIDC, policy on publisher sysdevs for this workflow file).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, vsce: win32-x64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, vsce: win32-arm64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, vsce: linux-x64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, vsce: linux-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, vsce: darwin-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, vsce: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # runescript-lsp depends on ../ares-compiler and ../ares-shared by path.
      - uses: actions/checkout@v4
        with: { path: vscode-runescript }
      - uses: actions/checkout@v4
        with: { repository: sysdevs/runescript-lsp, path: runescript-lsp }
      - uses: actions/checkout@v4
        with: { repository: sysdevs/ares-compiler, path: ares-compiler }
      - uses: actions/checkout@v4
        with: { repository: sysdevs/ares-shared, path: ares-shared }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: runescript-lsp, key: "${{ matrix.target }}" }
      - name: Build runescript-lsp
        working-directory: runescript-lsp
        run: cargo build --release --target ${{ matrix.target }}
      - name: Copy server binary
        run: |
          exe=runescript-lsp; [ "$RUNNER_OS" = Windows ] && exe=runescript-lsp.exe
          mkdir -p vscode-runescript/bin
          cp "runescript-lsp/target/${{ matrix.target }}/release/$exe" vscode-runescript/bin/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-runescript/package-lock.json
      - name: Package
        working-directory: vscode-runescript
        run: |
          npm ci
          npm run compile
          npx vsce package --target ${{ matrix.vsce }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce }}
          path: vscode-runescript/*.vsix
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { pattern: vsix-*, merge-multiple: true, path: dist }
      - name: GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        # The release may already exist (created in the UI, or a re-run).
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.vsix --clobber
      - name: Publish to Marketplace
        run: npx vsce publish --oidc --packagePath dist/*.vsix
